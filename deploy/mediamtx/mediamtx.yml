# MediaMTX: one RTSP/WebRTC relay per site (plan Section 7.4). Cameras or fake cameras publish
# here; the edge reads rtsp://localhost:8554/<camera_id>; dashboards can view WebRTC on :8889.
logLevel: warn
rtsp: yes
rtspAddress: :8554
webrtc: yes
webrtcAddress: :8889
hls: no
rtmp: no
srt: no
paths:
  # pull a real camera's sub-stream through the relay (one reader, many consumers):
  # cam-gate-01:
  #   source: rtsp://user:password@192.168.1.64:554/Streaming/Channels/102
  all_others:
