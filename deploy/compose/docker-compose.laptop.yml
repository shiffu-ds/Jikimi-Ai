# Laptop profile (i5-6200U, 12 GB): plan Section 7.8 with the v2.4 fixes:
# - restart: unless-stopped everywhere (power-cut recovery, F4)
# - healthchecks + depends_on: service_healthy (no race on boot)
# - pinned image tags; no MinIO (community images ended Oct 2025): local volume object store
# - Ollama only with `--profile llm`, observability only with `--profile observability`
# Daily work on 12 GB: prefer `make demo` (lite profile, ~1 GB). Use this file for integration.
name: jikimi-laptop

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: pgvector/pgvector:0.8.7-pg16
    mem_limit: 512m
    command: >
      postgres -c shared_buffers=128MB -c work_mem=8MB -c max_connections=40
               -c effective_cache_size=512MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jikimi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make env}
      POSTGRES_DB: ${POSTGRES_DB:-jikimi}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jikimi} -d ${POSTGRES_DB:-jikimi}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mediamtx:
    <<: *restart
    image: bluenviron/mediamtx:1.21.2
    mem_limit: 128m
    ports: ["8554:8554", "8889:8889"]   # RTSP, WebRTC (WHEP) for the live view
    volumes: ["../mediamtx/mediamtx.yml:/mediamtx.yml:ro"]

  api:
    <<: *restart
    build: { context: ../.., dockerfile: server/Dockerfile }
    image: jikimi/server:0.1.0
    mem_limit: 768m
    env_file: ../../.env
    environment:
      JIKIMI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jikimi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jikimi}
      JIKIMI_DATA_DIR: /data
      JIKIMI_WORKERS_INPROCESS: "true"
    volumes: ["serverdata:/data"]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }

  edge:
    <<: *restart
    build: { context: ../.., dockerfile: edge/Dockerfile.cpu }
    image: jikimi/edge-cpu:0.1.0
    mem_limit: 1536m
    env_file: ../../.env
    environment:
      JIKIMI_SERVER_URL: http://api:8000
      JIKIMI_EDGE_DATA_DIR: /data
      OMP_NUM_THREADS: "4"
    command: ["python", "-m", "jikimi_edge", "--config", "/app/edge/config/site.demo.yaml", "run"]
    volumes:
      - edgedata:/data
      - ../../models:/app/models:ro
      - ../../edge/config:/app/edge/config:ro
    depends_on:
      api: { condition: service_healthy }
      mediamtx: { condition: service_started }

  ollama:
    <<: *restart
    profiles: ["llm"]
    image: ollama/ollama:0.40.10
    mem_limit: 4g
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"   # LLM and VLM never loaded together on 12 GB
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "5m"
    volumes: ["ollama:/root/.ollama"]

volumes: { pgdata: {}, serverdata: {}, edgedata: {}, ollama: {} }
