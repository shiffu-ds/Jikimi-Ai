[project]
name = "jikimi-common"
version = "0.1.0"
description = "Shared utilities for Jikimi AI: config, logging, time (Asia/Karachi), ids, Urdu explanations"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pyyaml>=6.0", "tzdata>=2024.1", "jikimi-contracts"]

[tool.uv.sources]
jikimi-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.13"]
build-backend = "uv_build"
