[project]
name = "jikimi-console"
version = "0.1.0"
description = "Jikimi AI console: the Urdu-first Streamlit front end for supervisors, guards and police"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "streamlit>=1.45",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.13"]
build-backend = "uv_build"
