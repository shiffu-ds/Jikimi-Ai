# The console's look: a guard-room register - warm paper, ink, Pakistani green.
[server]
enableStaticServing = true
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0f5e4f"
backgroundColor = "#f7f3ea"
secondaryBackgroundColor = "#efe7d5"
textColor = "#1f2a33"
linkColor = "#0f5e4f"
borderColor = "#d9cfb8"
font = "Noto Sans"
headingFont = "Noto Serif"
baseRadius = "small"
showSidebarBorder = true

[[theme.fontFaces]]
family = "Noto Sans"
url = "app/static/NotoSans-Regular.ttf"
weight = 400
[[theme.fontFaces]]
family = "Noto Sans"
url = "app/static/NotoSans-SemiBold.ttf"
weight = 600
[[theme.fontFaces]]
family = "Noto Serif"
url = "app/static/NotoSerif-Regular.ttf"
weight = 400
[[theme.fontFaces]]
family = "Noto Serif"
url = "app/static/NotoSerif-Bold.ttf"
weight = 700

[theme.sidebar]
backgroundColor = "#ebe2cd"

[client]
toolbarMode = "minimal"
