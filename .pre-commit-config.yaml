repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: contracts-drift
        name: contracts -> TypeScript types up to date
        entry: uv run python scripts/gen_contract_types.py --check
        language: system
        pass_filenames: false
        files: ^packages/jikimi-contracts/
