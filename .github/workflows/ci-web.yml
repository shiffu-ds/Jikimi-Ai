name: ci-web
on:
  pull_request: { paths: ["apps/**", "packages/jikimi-contracts/**"] }
  push: { branches: [main] }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/dashboard } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/dashboard/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: "1" }
