name: replay-tests
# Golden scenarios -> expected alerts (plan Section 15.1). Required for PRs that touch analytics.
on:
  pull_request: { paths: ["edge/**", "packages/**", "eval/**"] }
  workflow_dispatch:
jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --all-packages --frozen
      - run: uv run pytest -m slow eval/tests -q
