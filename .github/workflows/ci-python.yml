name: ci-python
on:
  pull_request:
  push: { branches: [main] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: System packages (WeasyPrint, ffmpeg, Urdu fonts)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-core fonts-noto-extra
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not slow and not chaos" --cov --cov-report=term-missing:skip-covered
      - run: uv run python scripts/gen_contract_types.py --check

  postgres:
    # same API tests against PostgreSQL 16 + pgvector (the compose/server database)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env: { POSTGRES_USER: jikimi, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: jikimi_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U jikimi" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-core fonts-noto-extra
      - run: uv sync --all-packages --frozen --extra postgres
      - run: uv run pytest server/tests/test_api.py
        env: { JIKIMI_TEST_DATABASE_URL: "postgresql+psycopg://jikimi:ci-only-password@localhost:5432/jikimi_test" }
