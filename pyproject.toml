[project]
name = "jikimi-workspace"
version = "0.1.0"
description = "Jikimi AI (지킴이) — edge-first AI guard for existing CCTV. Workspace root."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "jikimi-contracts",
    "jikimi-common",
    "jikimi-crypto",
    "jikimi-ml-runtime",
    "jikimi-edge",
    "jikimi-server",
    "jikimi-ml",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-PyYAML>=6.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "edge", "server", "ml"]

[tool.uv.sources]
jikimi-contracts = { workspace = true }
jikimi-common = { workspace = true }
jikimi-crypto = { workspace = true }
jikimi-ml-runtime = { workspace = true }
jikimi-edge = { workspace = true }
jikimi-server = { workspace = true }
jikimi-ml = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["apps", "models", "data", "**/migrations/versions"]

[tool.ruff.lint]
# S = security (bandit rules), ASYNC = asyncio pitfalls
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = [
    "E501",   # the formatter wraps code; long strings/comments (Urdu text, URLs) are fine
    "S101",   # assert is fine in tests and invariants
    "S311",   # random is used for simulation/jitter, never for secrets
    "S603",   # subprocess calls use fixed argv lists (ffmpeg, ots, upsc)
    "S607",
    "RUF001", # Urdu text contains intentional Arabic-script characters
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S108"]
"server/src/jikimi_server/api/**" = ["B008"]   # FastAPI's File()/Form() defaults are the idiom
"eval/**" = ["S108"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = [
    "packages/jikimi-contracts/src",
    "packages/jikimi-common/src",
    "packages/jikimi-crypto/src",
    "packages/jikimi-ml-runtime/src",
]
packages = ["jikimi_contracts", "jikimi_common", "jikimi_crypto", "jikimi_ml_runtime"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cv2.*", "openvino.*", "onnxruntime.*", "tensorrt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "packages/jikimi-contracts/tests",
    "packages/jikimi-common/tests",
    "packages/jikimi-crypto/tests",
    "packages/jikimi-ml-runtime/tests",
    "edge/tests",
    "server/tests",
    "ml/tests",
    "eval/tests",
]
addopts = "-q --strict-markers --import-mode=importlib"
pythonpath = ["."]
markers = [
    "slow: model/video tests",
    "chaos: power/network cut tests",
]
filterwarnings = ["ignore::DeprecationWarning:weasyprint.*"]

[tool.coverage.run]
source = ["jikimi_contracts", "jikimi_common", "jikimi_crypto", "jikimi_ml_runtime", "jikimi_edge", "jikimi_server"]
omit = ["*/__main__.py"]
